name: CI

on:
    push:
        branches: [master]
    pull_request:
        branches: [master]

jobs:
    quality:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: 8.5
              tools: composer

        - name: Install dependencies
          run: composer install --no-interaction

        - name: Check code quality
          run: composer quality

    mutation:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: 8.5
              coverage: pcov
              ini-values: pcov.exclude="~/src/NamePrep/(CaseFoldingData|NamePrepData2003|NamePrepData2008)\.php$~"
              tools: composer, infection:0.34.2
          env:
              fail-fast: true

        - name: Install dependencies
          run: composer install --no-interaction

        - name: Run mutation tests
          run: infection --configuration=infection.json5.dist --only-covering-test-cases --min-msi=90 --min-covered-msi=90 --max-timeouts=30 --no-progress --no-interaction

    test:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version: [8.1, 8.2, 8.3, 8.4, 8.5, nightly]
                include:
                - php-version: nightly
                  allow-failure: true

        steps:
        - uses: actions/checkout@v3

        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: ${{ matrix.php-version }}
              tools: composer

        - name: Install dependencies (before_install)
          run: composer install

        - name: Run tests
          run: vendor/bin/phpunit
          continue-on-error: ${{ matrix.allow-failure == true }}

    lowest-dependencies:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v3

        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: 8.1
              tools: composer

        - name: Install lowest supported dependencies
          run: composer update --prefer-lowest --prefer-stable --no-audit --no-interaction

        - name: Run tests
          run: vendor/bin/phpunit

    consumer-smoke:
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php-version: [8.1, 8.5]

        steps:
        - uses: actions/checkout@v3

        - name: Set up PHP
          uses: shivammathur/setup-php@v2
          with:
              php-version: ${{ matrix.php-version }}
              tools: composer

        - name: Install as a production dependency
          run: composer install --working-dir=tests/smoke/consumer --no-dev --no-interaction

        - name: Run consumer smoke test
          run: php tests/smoke/consumer/smoke.php
